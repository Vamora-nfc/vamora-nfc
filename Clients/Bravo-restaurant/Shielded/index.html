<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Review - Bravo Restaurant</title>
    <!-- FontAwesome 6 for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #0d0f12;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            background: #161a22;
            border-radius: 24px;
            padding: 40px 28px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #232936;
            position: relative;
            overflow: hidden;
            transform: translateZ(0); /* Hardware acceleration */
        }

        /* Bravo Accent Glow Top Border */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #e11d48, #ffffff, #e11d48);
        }

        /* Language Switcher */
        .lang-switch {
            position: absolute;
            top: 18px;
            right: 18px;
            background: #232936;
            border: 1px solid #333b4d;
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        [dir="rtl"] .lang-switch {
            right: auto;
            left: 18px;
        }

        .lang-switch:hover {
            background: #2d3546;
            border-color: #e11d48;
        }

        .logo {
            max-width: 180px;
            max-height: 80px;
            height: auto;
            margin-top: 10px;
            margin-bottom: 24px;
            object-fit: contain;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        /* Star Rating */
        .stars {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
            direction: ltr;
        }

        .stars i {
            font-size: 38px;
            color: #2d3546;
            cursor: pointer;
            transition: color 0.15s ease, transform 0.15s ease;
            outline: none;
            will-change: transform, color;
        }

        .stars i:hover,
        .stars i.hovered,
        .stars i.active {
            color: #f59e0b;
            transform: scale(1.15) translateZ(0);
        }

        .rating-label {
            font-size: 13px;
            font-weight: 700;
            color: #f59e0b;
            min-height: 18px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* Chips */
        .chips-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .chip {
            background: #232936;
            border: 1px solid #333b4d;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 13px;
            color: #cbd5e1;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .chip:hover {
            background: #2d3546;
            color: #ffffff;
            border-color: #e11d48;
        }

        .chip.selected {
            background: #e11d48;
            color: #ffffff;
            border-color: #e11d48;
            font-weight: 600;
        }

        /* Form Controls */
        .feedback-form {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .textarea-wrapper {
            position: relative;
            margin-bottom: 16px;
            background-color: #0f1218;
            border: 1px solid #232936;
            border-radius: 14px;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        
        .textarea-wrapper:focus-within {
            border-color: #e11d48;
            background-color: #0b0d11;
        }

        .textarea-wrapper.error {
            border-color: #ef4444;
            background-color: #1a0f12;
        }

        .feedback-form textarea {
            width: 100%;
            height: 95px;
            border: none;
            background: transparent;
            padding: 14px;
            font-size: 14px;
            outline: none;
            resize: none;
            color: #f8fafc;
        }

        .feedback-form textarea::placeholder {
            color: #64748b;
        }

        /* Mic & Listening Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-top: 1px solid #1e2430;
            background: #13171f;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
        }

        /* Green Listening Indicator */
        .listening-status {
            font-size: 12px;
            color: #25d366;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 6px;
        }

        .listening-status.active {
            display: flex;
        }

        .listening-status .dot {
            width: 8px;
            height: 8px;
            background-color: #25d366;
            border-radius: 50%;
            animation: pulse-dot 1s infinite;
            will-change: opacity;
        }

        .tool-btn {
            background: #232936;
            border: 1px solid #333b4d;
            color: #f8fafc;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            will-change: transform;
        }

        [dir="rtl"] .tool-btn {
            margin-left: 0;
            margin-right: auto;
        }

        .tool-btn:hover {
            background: #2d3546;
            color: #e11d48;
            border-color: #e11d48;
        }

        .tool-btn.recording {
            background: #e11d48;
            color: #ffffff;
            border-color: #e11d48;
            animation: pulse 1.2s infinite;
        }

        /* Buttons */
        .send-btn {
            background-color: #25d366;
            color: #ffffff;
            border: none;
            padding: 14px 25px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            will-change: transform;
        }

        .send-btn:hover {
            background-color: #1ebc57;
            transform: translateY(-1px);
        }

        .google-bypass-btn {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #333b4d;
            padding: 11px 20px;
            border-radius: 25px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .google-bypass-btn:hover {
            background: #232936;
            color: #ffffff;
            border-color: #e11d48;
        }

        /* Success Screen */
        .success-message {
            display: none;
            animation: fadeIn 0.3s ease forwards;
            padding: 20px 0;
        }

        .success-message i {
            font-size: 52px;
            color: #25d366;
            margin-bottom: 16px;
        }

        /* Social Media Section */
        .social-links {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #232936;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 20px;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            will-change: transform;
            flex: 1;
            min-width: 130px;
        }

        .social-btn.instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .social-btn.instagram:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 39, 67, 0.3);
        }

        .social-btn.facebook {
            background-color: #1877f2;
        }

        .social-btn.facebook:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(24, 119, 242, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        @keyframes pulse-dot {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container" id="cardContainer">
    <button class="lang-switch" onclick="toggleLanguage()">
        <i class="fa-solid fa-globe"></i>
        <span id="langText">العربية</span>
    </button>

    <img src="logo.png" alt="Bravo Restaurant Logo" class="logo" id="businessLogo">

    <div id="mainContent">
        <h2 id="uiTitle">We Value Your Feedback!</h2>
        <p class="subtitle" id="uiSubtitle">Please rate your overall experience with us</p>

        <div class="stars" id="starContainer">
            <i class="fa-solid fa-star" data-value="1"></i>
            <i class="fa-solid fa-star" data-value="2"></i>
            <i class="fa-solid fa-star" data-value="3"></i>
            <i class="fa-solid fa-star" data-value="4"></i>
            <i class="fa-solid fa-star" data-value="5"></i>
        </div>
        <div class="rating-label" id="ratingText"></div>

        <div class="feedback-form" id="feedbackForm">
            <p style="margin-bottom: 14px; font-size: 14px; color: #cbd5e1;" id="uiSorryPrompt">
                We are sorry to hear that. Select what went wrong or type below:
            </p>
            
            <div class="chips-container" id="chipsContainer"></div>

            <div class="textarea-wrapper" id="textareaWrapper">
                <textarea id="feedbackText" placeholder="Type your feedback or tap the mic to speak..."></textarea>
                
                <div class="toolbar">
                    <div class="listening-status" id="listeningStatus">
                        <span class="dot"></span>
                        <span id="listeningText">Listening...</span>
                    </div>
                    
                    <button type="button" class="tool-btn" id="voiceBtn" title="Tap to Speak">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                </div>
            </div>
            
            <button class="send-btn" id="uiSubmitBtn" onclick="sendPrivateFeedback()">
                <i class="fa-brands fa-whatsapp"></i>
                <span id="sendBtnLabel">Send via WhatsApp</span>
            </button>
            <button class="google-bypass-btn" id="uiBypassBtn" onclick="redirectToGoogle()">Prefer to review on Google directly?</button>
        </div>
    </div>

    <div class="success-message" id="successMessage">
        <i class="fa-circle-check fa-regular"></i>
        <h2 id="uiSuccessTitle">Feedback Sent</h2>
        <p class="subtitle" id="uiSuccessSub" style="margin-bottom: 0;">Your feedback helps us improve.</p>
    </div>

    <div class="social-links">
        <a href="" target="_blank" class="social-btn instagram" id="instagramLink">
            <i class="fa-brands fa-instagram" style="font-size: 18px;"></i>
            Instagram
        </a>
        <a href="" target="_blank" class="social-btn facebook" id="facebookLink">
            <i class="fa-brands fa-facebook-f" style="font-size: 16px;"></i>
            Facebook
        </a>
    </div>
</div>

<script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const GOOGLE_REVIEW_URL = "https://search.google.com/local/writereview?placeid=ChIJxcZvLY4-WBQRY2q_dQ7hhXI";
    const WHATSAPP_NUMBER   = "201100000000"; 
    const INSTAGRAM_URL     = "https://www.instagram.com/bravorestaurant1?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==&igsi=ZDNlZDc0MzIxNw==";
    const FACEBOOK_URL      = "https://www.facebook.com/bravorestauranteg";
    // ==========================================

    const i18n = {
        en: {
            langBtn: "العربية",
            dir: "ltr",
            title: "We Value Your Feedback!",
            subtitle: "Please rate your overall experience with us",
            ratingLabels: ["Poor", "Fair", "Good", "Very Good", "Excellent"],
            sorryPrompt: "We are sorry to hear that. Select what went wrong or type below:",
            placeholder: "Type your feedback or tap the mic to speak...",
            submitBtn: "Send via WhatsApp",
            bypassBtn: "Prefer to review on Google directly?",
            successTitle: "Feedback Sent",
            successSub: "Your feedback helps us improve.",
            listening: "Listening...",
            chips: [
                { id: "pricing", en: "High Pricing", ar: "الأسعار مرتفعة" },
                { id: "service", en: "Customer Service", ar: "خدمة العملاء" },
                { id: "quality", en: "Quality", ar: "الجودة" },
                { id: "wait", en: "Long Wait Time", ar: "وقت الانتظار" },
                { id: "cleanliness", en: "Cleanliness", ar: "النظافة" }
            ]
        },
        ar: {
            langBtn: "English",
            dir: "rtl",
            title: "رأيك يهمنا جداً!",
            subtitle: "يرجى تقييم تجربتك العامة معنا",
            ratingLabels: ["سيء جداً", "مقبول", "جيد", "جيد جداً", "ممتاز"],
            sorryPrompt: "نأسف لسماع ذلك. يرجى تحديد الأسباب أو كتابة الملاحظات:",
            placeholder: "اكتب ملاحظاتك أو اضغط على الميكروفون للتحدث...",
            submitBtn: "إرسال عبر واتساب",
            bypassBtn: "هل تفضل التقييم على جوجل مباشرة؟",
            successTitle: "تم الإرسال",
            successSub: "ملاحظاتك تساعدنا على تحسين خدماتنا دائماً.",
            listening: "جاري الاستماع...",
            chips: [
                { id: "pricing", en: "High Pricing", ar: "الأسعار مرتفعة" },
                { id: "service", en: "Customer Service", ar: "خدمة العملاء" },
                { id: "quality", en: "Quality", ar: "الجودة" },
                { id: "wait", en: "Long Wait Time", ar: "وقت الانتظار" },
                { id: "cleanliness", en: "Cleanliness", ar: "النظافة" }
            ]
        }
    };

    let currentLang = 'en';
    let currentRating = 0;
    let selectedChips = new Set();

    const stars = document.querySelectorAll('#starContainer i');
    const feedbackForm = document.getElementById('feedbackForm');
    const ratingText = document.getElementById('ratingText');
    const feedbackText = document.getElementById('feedbackText');
    const textareaWrapper = document.getElementById('textareaWrapper');
    const mainContent = document.getElementById('mainContent');
    const successMessage = document.getElementById('successMessage');
    const chipsContainer = document.getElementById('chipsContainer');
    const instagramBtn = document.getElementById('instagramLink');
    const facebookBtn = document.getElementById('facebookLink');
    const listeningStatus = document.getElementById('listeningStatus');
    const listeningText = document.getElementById('listeningText');
    const voiceBtn = document.getElementById('voiceBtn');

    function renderLanguage() {
        const langData = i18n[currentLang];
        document.documentElement.setAttribute('dir', langData.dir);
        document.getElementById('langText').textContent = langData.langBtn;
        document.getElementById('uiTitle').textContent = langData.title;
        document.getElementById('uiSubtitle').textContent = langData.subtitle;
        document.getElementById('uiSorryPrompt').textContent = langData.sorryPrompt;
        document.getElementById('feedbackText').placeholder = langData.placeholder;
        document.getElementById('sendBtnLabel').textContent = langData.submitBtn;
        document.getElementById('uiBypassBtn').textContent = langData.bypassBtn;
        document.getElementById('uiSuccessTitle').textContent = langData.successTitle;
        document.getElementById('uiSuccessSub').textContent = langData.successSub;
        listeningText.textContent = langData.listening;

        if (currentRating > 0) {
            ratingText.textContent = langData.ratingLabels[currentRating - 1];
        }

        renderChips();
    }

    function toggleLanguage() {
        currentLang = currentLang === 'en' ? 'ar' : 'en';
        if (isListening) stopListening();
        renderLanguage();
    }

    function renderChips() {
        const fragment = document.createDocumentFragment();
        chipsContainer.innerHTML = '';
        const chipsList = i18n[currentLang].chips;

        chipsList.forEach(chip => {
            const btn = document.createElement('div');
            btn.className = `chip ${selectedChips.has(chip.id) ? 'selected' : ''}`;
            btn.textContent = currentLang === 'ar' ? chip.ar : chip.en;
            btn.onclick = () => {
                if (selectedChips.has(chip.id)) {
                    selectedChips.delete(chip.id);
                    btn.classList.remove('selected');
                } else {
                    selectedChips.add(chip.id);
                    btn.classList.add('selected');
                }
                textareaWrapper.classList.remove('error');
            };
            fragment.appendChild(btn);
        });
        chipsContainer.appendChild(fragment);
    }

    // --- STARS ---
    stars.forEach((star, index) => {
        star.addEventListener('mouseenter', () => highlightStars(index + 1, 'hovered'));
        star.addEventListener('mouseleave', () => clearHighlights('hovered'));
        star.addEventListener('click', () => selectRating(index + 1));
    });

    function highlightStars(count, className) {
        stars.forEach((s, idx) => {
            if (idx < count) s.classList.add(className);
            else s.classList.remove(className);
        });
        if (className === 'hovered') {
            ratingText.textContent = i18n[currentLang].ratingLabels[count - 1] || '';
        }
    }

    function clearHighlights(className) {
        stars.forEach(s => s.classList.remove(className));
        ratingText.textContent = currentRating > 0 ? i18n[currentLang].ratingLabels[currentRating - 1] : '';
    }

    function selectRating(rating) {
        currentRating = rating;
        highlightStars(rating, 'active');
        ratingText.textContent = i18n[currentLang].ratingLabels[rating - 1];

        if (rating >= 4) {
            feedbackForm.style.display = 'none';
            redirectToGoogle();
        } else {
            feedbackForm.style.display = 'block';
        }
    }

    // --- OPTIMIZED HIGH-PERFORMANCE SPEECH RECOGNITION ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;
    let baseTranscript = '';

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = function() {
            isListening = true;
            voiceBtn.classList.add('recording');
            listeningStatus.classList.add('active');
            baseTranscript = feedbackText.value ? feedbackText.value + ' ' : '';
        };

        recognition.onresult = function(event) {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    baseTranscript += event.results[i][0].transcript + ' ';
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            
            // RAF prevents DOM thrashing and lag
            window.requestAnimationFrame(() => {
                feedbackText.value = baseTranscript + interimTranscript;
                textareaWrapper.classList.remove('error');
            });
        };

        recognition.onerror = function(event) {
            stopListening();
        };

        recognition.onend = function() {
            stopListening();
        };
    }

    function startListening() {
        if (!SpeechRecognition) return;
        try {
            isListening = true;
            recognition.lang = currentLang === 'ar' ? 'ar-EG' : 'en-US';
            recognition.start();
        } catch (e) {
            stopListening();
        }
    }

    function stopListening() {
        isListening = false;
        voiceBtn.classList.remove('recording');
        listeningStatus.classList.remove('active');
        if (recognition) {
            try { recognition.stop(); } catch (e) {}
        }
    }

    voiceBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (isListening) {
            stopListening();
        } else {
            startListening();
        }
    });

    // --- SUBMISSION ---
    function sendPrivateFeedback() {
        if (isListening) stopListening();

        const customText = feedbackText.value.trim();
        
        if (selectedChips.size === 0 && !customText) {
            textareaWrapper.classList.add('error');
            return;
        }

        const selectedChipObjList = i18n.en.chips.filter(c => selectedChips.has(c.id));
        const tagsSummary = selectedChipObjList.map(c => `${c.en} (${c.ar})`).join(", ");
        const ratingTextLabel = i18n.en.ratingLabels[currentRating - 1];

        let bodyText = `*NEW CUSTOMER FEEDBACK / COMPLAINT*\n\n`;
        bodyText += `*Rating:* ${currentRating} (${ratingTextLabel})\n`;
        if (tagsSummary) bodyText += `*Selected Reasons:* ${tagsSummary}\n`;
        if (customText) bodyText += `\n*Comments:*\n${customText}`;

        const encodedMessage = encodeURIComponent(bodyText);
        
        if (WHATSAPP_NUMBER) {
            window.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;
        }

        document.getElementById('uiSuccessTitle').textContent = i18n[currentLang].successTitle;
        document.getElementById('uiSuccessSub').textContent = i18n[currentLang].successSub;
        
        mainContent.style.display = 'none';
        successMessage.style.display = 'block';
    }

    function redirectToGoogle() {
        if (GOOGLE_REVIEW_URL) {
            window.location.href = GOOGLE_REVIEW_URL;
        }
    }

    if (INSTAGRAM_URL) {
        instagramBtn.href = INSTAGRAM_URL;
    }

    if (FACEBOOK_URL) {
        facebookBtn.href = FACEBOOK_URL;
    }

    feedbackText.addEventListener('input', () => {
        textareaWrapper.classList.remove('error');
    });

    renderLanguage();
</script>

</body>
</html>
